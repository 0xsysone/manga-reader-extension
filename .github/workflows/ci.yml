name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run zip
      - run: npm run zip:firefox
      - uses: actions/upload-artifact@v7
        with:
          name: extension-packages
          path: .output/*.zip
          # WXT writes to `.output/`, which upload-artifact skips by default as a hidden folder.
          include-hidden-files: true
          if-no-files-found: error
