<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manga Reader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <span class="seal">読</span>
    <div class="brand">
      <strong>Manga Reader</strong>
      <span data-i18n="popupTagline"></span>
    </div>
  </header>

  <section class="site" id="site" hidden>
    <span class="site-dot" id="site-dot"></span>
    <div class="site-text">
      <span class="site-host" id="site-host"></span>
      <span class="site-sub" id="site-sub"></span>
    </div>
    <button class="ghost" id="site-btn" type="button" hidden></button>
  </section>

  <section class="now" id="now" hidden>
    <div class="now-text">
      <span class="now-title" id="now-title"></span>
      <span class="now-sub" id="now-sub"></span>
    </div>
    <button class="cta" id="open" type="button" data-i18n="read"></button>
  </section>
  <p class="hint" id="hint" data-i18n="hintOpenChapter"></p>

  <form id="form" autocomplete="off">
    <fieldset class="field">
      <legend data-i18n="legendDisplay"></legend>
      <div class="seg" data-name="mode">
        <label><input type="radio" name="mode" value="single"><span data-i18n="modeSingle"></span></label>
        <label><input type="radio" name="mode" value="double"><span data-i18n="modeDouble"></span></label>
        <label><input type="radio" name="mode" value="auto"><span data-i18n="modeAuto"></span></label>
      </div>
    </fieldset>

    <fieldset class="field">
      <legend data-i18n="readingDirection"></legend>
      <div class="seg" data-name="direction">
        <label><input type="radio" name="direction" value="rtl"><span data-i18n="dirJapanese"></span></label>
        <label><input type="radio" name="direction" value="ltr"><span data-i18n="dirWestern"></span></label>
      </div>
    </fieldset>

    <fieldset class="field">
      <legend data-i18n="animation"></legend>
      <div class="seg" data-name="animation">
        <label><input type="radio" name="animation" value="flip"><span data-i18n="animFlip"></span></label>
        <label><input type="radio" name="animation" value="slide"><span data-i18n="animSlide"></span></label>
        <label><input type="radio" name="animation" value="none"><span data-i18n="animNoneShort"></span></label>
      </div>
    </fieldset>

    <fieldset class="field">
      <legend data-i18n="legendTheme"></legend>
      <div class="seg" data-name="theme">
        <label><input type="radio" name="theme" value="dark"><span data-i18n="themeDark"></span></label>
        <label><input type="radio" name="theme" value="light"><span data-i18n="themeLight"></span></label>
      </div>
    </fieldset>

    <label class="toggle">
      <span><strong data-i18n="coverAlone"></strong><small data-i18n="optCoverAloneSub"></small></span>
      <input type="checkbox" name="firstPageAlone"><i></i>
    </label>
    <label class="toggle">
      <span><strong data-i18n="optAutoOpen"></strong><small data-i18n="optAutoOpenSub"></small></span>
      <input type="checkbox" name="autoOpen"><i></i>
    </label>
  </form>

  <footer class="foot">
    <span><kbd>←</kbd><kbd>→</kbd> <span data-i18n="footPages"></span></span>
    <span><kbd>D</kbd> <span data-i18n="footMode"></span></span>
    <span><kbd>M</kbd> <span data-i18n="footTheme"></span></span>
    <span><kbd>?</kbd> <span data-i18n="footHelp"></span></span>
  </footer>
  <script src="../src/core.js"></script>
  <script src="../src/i18n.js"></script>
  <script src="../src/sites.js"></script>
  <script src="popup.js"></script>
</body>
</html>
